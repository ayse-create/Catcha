<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🐈 WhiskerCatcha: Cat-cha</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0d16; --panel:#1a1726; --panel2:#241f33; --line:#332c47;
  --text:#ece9f5; --muted:#9b93b3; --accent:#ffb347; --accent2:#7c5cff;
  --good:#4ade80; --bad:#f87171;
}
html,body{height:100%}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  background:radial-gradient(circle at 50% -10%,#2a2145 0%,#0f0d16 55%) fixed;
  color:var(--text); min-height:100vh; display:flex; flex-direction:column;
  align-items:center; padding:14px 12px 26px; -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
}
.app{width:100%;max-width:760px;display:flex;flex-direction:column;gap:14px;flex:1}

/* ---------- header ---------- */
header{display:flex;flex-direction:column;gap:9px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:1.05rem;letter-spacing:.2px}
.brand .em{font-size:1.4rem;filter:drop-shadow(0 0 10px rgba(255,179,71,.45))}
.brand small{color:var(--accent);font-weight:700;letter-spacing:1.5px;font-size:.68rem;
  border:1px solid rgba(255,179,71,.4);padding:2px 7px;border-radius:99px;background:rgba(255,179,71,.08)}
.progress{height:7px;border-radius:99px;background:#221d33;overflow:hidden;border:1px solid var(--line)}
.progress .bar{height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .45s cubic-bezier(.2,.9,.3,1)}
.meta{display:flex;align-items:center;gap:8px;font-size:.76rem;color:var(--muted);flex-wrap:wrap}
.meta .num{font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.meta .ttl{color:var(--text);font-weight:600}

/* ---------- stage ---------- */
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(180deg,rgba(36,31,51,.75),rgba(26,23,38,.9));
  border:1px solid var(--line);border-radius:20px;padding:20px 16px;min-height:400px;
  box-shadow:0 24px 60px -30px #000, inset 0 1px 0 rgba(255,255,255,.04);position:relative;overflow:hidden}
.prompt{font-size:.95rem;font-weight:700;text-align:center;margin-bottom:14px;line-height:1.5;max-width:520px}
.prompt .hl{color:var(--accent)}
.hint{font-size:.75rem;color:var(--muted);text-align:center;margin-top:14px;line-height:1.5;max-width:460px}

/* ---------- buttons ---------- */
.btn{border:none;border-radius:12px;padding:11px 20px;font-size:.88rem;font-weight:700;
  cursor:pointer;font-family:inherit;transition:.16s;background:var(--panel2);color:var(--text);
  border:1px solid var(--line)}
.btn:hover{background:#2e2742;transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.primary{background:linear-gradient(135deg,var(--accent2),#a06bff);border-color:transparent;
  box-shadow:0 8px 22px -10px var(--accent2)}
.btn.primary:hover{filter:brightness(1.12)}
.btn.warm{background:linear-gradient(135deg,#ff9f43,#ffb347);color:#231a0a;border-color:transparent;
  box-shadow:0 8px 22px -10px #ff9f43}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none;box-shadow:none}
.btn.small{padding:7px 13px;font-size:.75rem;border-radius:9px}

/* ---------- level 1 / 13 ---------- */
.captcha-box{width:100%;max-width:400px;background:#f4f4f6;border-radius:12px;padding:18px;
  color:#222;box-shadow:0 20px 50px -25px #000;border:1px solid #d8d8e0}
.captcha-box .head{display:flex;justify-content:space-between;align-items:center;
  font-size:.7rem;color:#7b7b8c;border-bottom:1px solid #e0e0e8;padding-bottom:8px;margin-bottom:14px;letter-spacing:.4px}
.check-row{display:flex;align-items:center;gap:11px;cursor:pointer;padding:9px 4px;border-radius:8px;transition:.15s}
.check-row:hover{background:#eaeaef}
.check-row input{position:absolute;opacity:0;pointer-events:none}
.check-row .box{width:22px;height:22px;border:2px solid #a9a9bd;border-radius:5px;flex:0 0 auto;
  position:relative;transition:.15s;background:#fff}
.check-row input:checked + .box{background:#3b82f6;border-color:#3b82f6}
.check-row input:checked + .box::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;
  border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.check-row .cb-label{font-size:.9rem;font-weight:600;font-family:ui-monospace,Menlo,monospace}
.captcha-box .btn{margin-top:16px;width:100%;background:#3b82f6;color:#fff;border-radius:8px}
.captcha-box .btn:hover{background:#2f6fd8}

/* checkbox list (level 13) */
.cb-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;width:100%;max-width:620px}
.cb-item{background:#f4f4f6;color:#222;border-radius:9px;padding:9px 12px;display:flex;align-items:center;gap:9px;
  cursor:pointer;font-size:.8rem;font-family:ui-monospace,Menlo,monospace;font-weight:600;transition:.14s;border:2px solid transparent}
.cb-item:hover{background:#e6e6ee;transform:translateY(-1px)}
.cb-item .bx{width:16px;height:16px;border:2px solid #a9a9bd;border-radius:4px;flex:0 0 auto;background:#fff;position:relative}
.cb-item.sel .bx{background:#3b82f6;border-color:#3b82f6}
.cb-item.sel .bx::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}

/* ---------- generic grid ---------- */
.grid{display:grid;gap:7px;width:100%;max-width:430px}
.tile{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;cursor:pointer;
  background:#2a2440;border:2px solid transparent;transition:.14s;display:flex;align-items:center;justify-content:center;
  font-size:2rem;user-select:none}
.tile:hover{transform:scale(1.04);border-color:rgba(255,179,71,.55);z-index:2}
.tile.sel{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,179,71,.28) inset}
.tile.sel::after{content:"✓";position:absolute;top:3px;right:5px;font-size:.7rem;font-weight:900;color:#231a0a;
  background:var(--accent);border-radius:99px;width:16px;height:16px;display:grid;place-items:center;line-height:1}
.tile.ok{border-color:var(--good)!important;box-shadow:0 0 0 3px rgba(74,222,128,.3) inset}
.tile.no{border-color:var(--bad)!important;animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.tile.good{background:linear-gradient(160deg,#2f4a3a,#1f3328)}
.tile.bad{background:linear-gradient(160deg,#4a2f3a,#332028)}

/* ---------- moving text ---------- */
.charfield{position:relative;height:120px;width:100%;max-width:440px;display:flex;
  align-items:center;justify-content:center;gap:6px;background:#100e1a;border-radius:14px;
  border:1px solid var(--line);overflow:hidden}
.chr{font-family:ui-monospace,Menlo,monospace;font-weight:900;font-size:2.5rem;color:#c9c2e6;
  display:inline-block;text-shadow:0 0 18px rgba(124,92,255,.55);will-change:transform}
.input-row{display:flex;gap:8px;width:100%;max-width:400px;margin-top:14px}
.input-row input{flex:1;background:#100e1a;border:1px solid var(--line);border-radius:11px;padding:12px 14px;
  color:var(--text);font-size:1rem;font-family:ui-monospace,Menlo,monospace;letter-spacing:3px;text-align:center;
  text-transform:uppercase;outline:none;transition:.15s}
.input-row input:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(124,92,255,.18)}

/* ---------- rotate puzzle ---------- */
.rot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;width:100%;max-width:330px;
  background:#0c0a14;padding:4px;border-radius:14px;border:1px solid var(--line)}
.rot-tile{aspect-ratio:1;border-radius:5px;cursor:pointer;background-size:cover;background-position:center;
  transition:transform .28s cubic-bezier(.3,1.4,.5,1);overflow:hidden}
.rot-tile:hover{outline:2px solid var(--accent);outline-offset:-2px}

/* ---------- tic tac toe ---------- */
.ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;width:100%;max-width:300px}
.ttt .cell{aspect-ratio:1;background:#221d33;border:1px solid var(--line);border-radius:14px;
  display:grid;place-items:center;font-size:2.4rem;cursor:pointer;transition:.15s}
.ttt .cell:hover:not(.taken){background:#2e2742;transform:scale(1.04)}
.ttt .cell.taken{cursor:default}
.ttt .cell.win{background:rgba(74,222,128,.18);border-color:var(--good)}

/* ---------- word search ---------- */
.ws{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;width:100%;max-width:430px;
  background:#141122;padding:6px;border-radius:12px;border:1px solid var(--line);user-select:none}
.ws .c{aspect-ratio:1;display:grid;place-items:center;font-family:ui-monospace,monospace;font-weight:700;
  font-size:.72rem;color:#b9b1d4;border-radius:4px;cursor:pointer;transition:.1s}
.ws .c:hover{background:#2a2440;color:#fff}
.ws .c.start{background:var(--accent2);color:#fff}
.ws .c.found{background:rgba(74,222,128,.3);color:#dfffe9}
.wordlist{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;justify-content:center}
.wordlist span{font-family:ui-monospace,monospace;font-size:.78rem;padding:4px 11px;border-radius:99px;
  background:#221d33;border:1px solid var(--line);color:var(--muted);transition:.2s}
.wordlist span.done{background:rgba(74,222,128,.16);color:var(--good);border-color:rgba(74,222,128,.4);text-decoration:line-through}

/* ---------- license plate ---------- */
.plate-scene{width:100%;max-width:440px;background:#141122;border-radius:16px;padding:22px 18px;
  border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:14px;position:relative;overflow:hidden}
.plate-scene .car-emoji{font-size:3.4rem;filter:drop-shadow(0 6px 14px rgba(0,0,0,.6))}
.plate{background:#f7f7f9;border:3px solid #1b1b22;border-radius:7px;padding:7px 16px;position:relative;
  display:flex;align-items:center;gap:9px;box-shadow:0 8px 22px -12px #000}
.plate .strip{background:#1e40af;color:#fff;font-size:.52rem;font-weight:800;padding:4px 4px;border-radius:3px;
  writing-mode:vertical-rl;letter-spacing:1px;line-height:1}
.plate .txt{font-family:ui-monospace,"Courier New",monospace;font-weight:800;font-size:1.85rem;color:#15151c;
  letter-spacing:5px;filter:blur(.45px) skewX(-1.4deg);text-shadow:0 0 1px rgba(0,0,0,.35)}

/* ---------- whack a mole ---------- */
.wam{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;width:100%;max-width:350px}
.hole{aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 35%,#1a1526,#0c0a14);
  border:2px solid var(--line);display:grid;place-items:center;font-size:2.2rem;cursor:pointer;
  position:relative;overflow:hidden;transition:.1s}
.hole:active{transform:scale(.96)}
.hole .cat{transform:translateY(120%);transition:transform .12s cubic-bezier(.3,1.5,.5,1)}
.hole.up .cat{transform:translateY(0)}

/* ---------- escaping cats ---------- */
.arena{position:relative;width:100%;max-width:560px;height:340px;background:
  radial-gradient(circle at 50% 50%,#1c1730,#0d0b16);border-radius:16px;border:1px solid var(--line);overflow:hidden}
.ecat{position:absolute;font-size:2rem;cursor:pointer;user-select:none;transition:transform .08s;
  filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))}
.ecat:hover{transform:scale(1.18)}
.ecat.caught{animation:pop .28s forwards}
@keyframes pop{to{transform:scale(2);opacity:0}}

/* ---------- parking ---------- */
.park-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
canvas.park{width:100%;max-width:660px;border-radius:14px;background:#161320;border:1px solid var(--line);
  touch-action:none;display:block}
.dpad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,58px);gap:7px;justify-content:center}
.dpad button{background:var(--panel2);border:1px solid var(--line);border-radius:13px;color:var(--text);
  font-size:1.15rem;cursor:pointer;display:grid;place-items:center;transition:.1s;user-select:none;font-family:inherit}
.dpad button:active,.dpad button.on{background:var(--accent2);border-color:var(--accent2);transform:scale(.95)}
.dpad .sp{visibility:hidden}
.stat-row{display:flex;gap:16px;font-size:.8rem;color:var(--muted);font-weight:700}
.stat-row b{color:var(--accent)}

/* ---------- pie / eye test ---------- */
.pie-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:100%;max-width:400px}
.pie{aspect-ratio:1;cursor:pointer;border-radius:50%;transition:.15s;padding:5px}
.pie:hover{transform:scale(1.07);background:rgba(255,179,71,.1)}
.pie.sel{background:rgba(255,179,71,.2)}
.ref{display:flex;align-items:center;gap:12px;background:#221d33;border:1px solid var(--line);
  padding:9px 16px;border-radius:14px;margin-bottom:16px}
.ref svg{width:52px;height:52px}
.ref span{font-size:.8rem;color:var(--muted);font-weight:700}
.ref b{color:var(--accent);font-size:1rem}

.eyegrid{display:grid;gap:4px;width:100%;max-width:380px;background:#100e1a;padding:10px;border-radius:14px;border:1px solid var(--line)}
.eyegrid .e{aspect-ratio:1;display:grid;place-items:center;font-family:ui-monospace,monospace;font-weight:800;
  font-size:1.05rem;color:#cfc7ea;cursor:pointer;border-radius:5px;transition:.1s}
.eyegrid .e:hover{background:#251f38;color:#fff}

/* ---------- draw ---------- */
.draw-wrap{position:relative;width:100%;max-width:440px}
canvas.draw{width:100%;aspect-ratio:1;background:#f4f2fa;border-radius:16px;cursor:crosshair;
  touch-action:none;display:block;border:1px solid var(--line)}

/* ---------- overlay ---------- */
.overlay{position:fixed;inset:0;background:rgba(8,6,14,.86);backdrop-filter:blur(9px);z-index:50;
  display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:.28s}
.overlay.show{opacity:1;pointer-events:auto}
.modal{background:linear-gradient(180deg,#241f33,#191528);border:1px solid var(--line);border-radius:22px;
  padding:30px 26px;max-width:400px;width:100%;text-align:center;transform:scale(.9) translateY(14px);transition:.34s cubic-bezier(.2,1.3,.4,1);
  box-shadow:0 40px 80px -30px #000}
.overlay.show .modal{transform:scale(1) translateY(0)}
.modal .ico{font-size:3.2rem;margin-bottom:10px;filter:drop-shadow(0 0 22px rgba(255,179,71,.5))}
.modal h2{font-size:1.35rem;margin-bottom:7px;font-weight:800}
.modal p{color:var(--muted);font-size:.84rem;line-height:1.6;margin-bottom:20px}
.modal .btn{width:100%}

/* level map */
.map-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:18px}
.map-grid button{aspect-ratio:1;border-radius:11px;border:1px solid var(--line);background:#221d33;
  color:var(--muted);font-weight:800;font-size:.8rem;cursor:pointer;transition:.14s;font-family:inherit}
.map-grid button.done{background:rgba(74,222,128,.16);border-color:rgba(74,222,128,.45);color:var(--good)}
.map-grid button.cur{background:linear-gradient(135deg,var(--accent2),#a06bff);border-color:transparent;color:#fff;
  box-shadow:0 6px 16px -8px var(--accent2)}
.map-grid button:disabled{opacity:.3;cursor:not-allowed}

/* toast */
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,90px);z-index:99;
  background:#2a1f2b;border:1px solid rgba(248,113,113,.42);color:#ffd9d9;padding:11px 20px;border-radius:13px;
  font-size:.82rem;font-weight:700;transition:.32s cubic-bezier(.2,1.3,.4,1);pointer-events:none;max-width:88vw;text-align:center}
#toast.show{transform:translate(-50%,0)}
#toast.good{background:#1d2a22;border-color:rgba(74,222,128,.42);color:#d5ffe4}

/* footer */
footer{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
footer .btn{background:transparent;color:var(--muted);border-color:var(--line);font-size:.75rem;padding:8px 14px}
footer .btn:hover{color:var(--text)}

@media(max-width:520px){
  .chr{font-size:1.9rem}
  .plate .txt{font-size:1.4rem;letter-spacing:3px}
  .ws .c{font-size:.6rem}
  .captcha-box{padding:14px}
  main{padding:16px 12px;border-radius:16px}
  .modal{padding:24px 20px}
}
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="brand">
      <span class="em">🐈</span> WhiskerCatcha <small>CAT-CHA</small>
    </div>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <div class="meta">
      <span class="num" id="lvlNum">01</span>
      <span>/ 24</span>
      <span class="ttl" id="lvlTitle">I'm not a cat</span>
    </div>
  </header>

  <main id="stage"></main>

  <footer>
    <button class="btn" id="btnReset">↺ Bölümü Yeniden Başlat</button>
    <button class="btn" id="btnMap">🗺 Bölüm Haritası</button>
  </footer>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div id="toast"></div>

<script>
/* ═══════════════════════════════════════════════════════════
   YARDIMCILAR
   ═══════════════════════════════════════════════════════════ */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[randInt(0, a.length - 1)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = randInt(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };

const stage   = $('#stage');
const overlay = $('#overlay');
const modal   = $('#modal');
const toastEl = $('#toast');

/* ═══════════════════════════════════════════════════════════
   DURUM
   ═══════════════════════════════════════════════════════════ */
const State = { level: 1, unlocked: 1, done: new Set() };

function save() {
  try {
    localStorage.setItem('whisker', JSON.stringify({
      level: State.level, unlocked: State.unlocked, done: [...State.done]
    }));
  } catch (e) {}
}
function load() {
  try {
    const d = JSON.parse(localStorage.getItem('whisker') || 'null');
    if (d) { State.level = d.level || 1; State.unlocked = d.unlocked || 1; State.done = new Set(d.done || []); }
  } catch (e) {}
}

/* ═══════════════════════════════════════════════════════════
   TOAST
   ═══════════════════════════════════════════════════════════ */
let toastTimer;
function toast(msg, good = false) {
  toastEl.textContent = msg;
  toastEl.className = good ? 'good show' : 'show';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.className = good ? 'good' : '', 1900);
}

/* ═══════════════════════════════════════════════════════════
   TEMİZLEME KAYIT
   ═══════════════════════════════════════════════════════════ */
let currentCleanup = null;

/* ═══════════════════════════════════════════════════════════
   ORTAK: TAMAMLANMA
   ═══════════════════════════════════════════════════════════ */
function showComplete(levelIndex) {
  const isFinal = levelIndex === 24;
  const total = State.done.size;
  modal.innerHTML = `
    <div class="ico">${isFinal ? '🏆🐈' : '✅'}</div>
    <h2>${isFinal ? 'Tebrikler! İnsan olduğun kanıtlandı.' : 'Doğrulama Başarılı'}</h2>
    <p>${isFinal
      ? `24 bölümün tamamını bitirdin. Toplam <b style="color:var(--accent)">${total}/24</b> doğrulama tamamlandı. Artık resmî olarak kedi değilsin. 🐾`
      : `Bölüm ${levelIndex} tamamlandı. Sıradaki görev seni bekliyor.`}</p>
    <button class="btn primary" id="modalNext">${isFinal ? 'Baştan Oyna' : 'Sonraki Bölüm →'}</button>
  `;
  overlay.classList.add('show');
  $('#modalNext').onclick = () => {
    overlay.classList.remove('show');
    if (isFinal) { State.level = 1; save(); goTo(1); }
    else goTo(Math.min(24, levelIndex + 1));
  };
}

function makeDone(levelIndex) {
  let fired = false;
  return () => {
    if (fired) return;
    fired = true;
    State.done.add(levelIndex);
    State.unlocked = Math.max(State.unlocked, Math.min(24, levelIndex + 1));
    save(); updateHeader();
    setTimeout(() => showComplete(levelIndex), 420);
  };
}

/* ═══════════════════════════════════════════════════════════
   HEADER
   ═══════════════════════════════════════════════════════════ */
function updateHeader() {
  const lv = LEVELS[State.level - 1];
  $('#lvlNum').textContent = String(State.level).padStart(2, '0');
  $('#lvlTitle').textContent = lv ? lv.title : '';
  $('#bar').style.width = (State.done.size / 24 * 100) + '%';
}

/* ═══════════════════════════════════════════════════════════
   NAVİGASYON
   ═══════════════════════════════════════════════════════════ */
function goTo(n) {
  if (currentCleanup) { try { currentCleanup(); } catch (e) {} currentCleanup = null; }
  State.level = Math.max(1, Math.min(24, n));
  save(); updateHeader();
  stage.innerHTML = '';
  const lv = LEVELS[State.level - 1];
  const res = lv.build(stage, makeDone(State.level));
  currentCleanup = (typeof res === 'function') ? res : null;
  stage.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

const CATS   = ['🐈', '🐱', '🐈‍⬛'];
const NONCAT = ['🐕', '🐩', '🦮', '🐕‍🦺', '🐇', '🦊', '🐻', '🐼', '🐨', '🦝', '🐹', '🦔'];
const OBJECTS = ['🧸', '🗿', '🏺', '🪆', '🎎', '🎠', '🪁', '🎭', '🧩', '🪀'];

/** Bir canvas üzerine sevimli bir kedi sahnesi çizer. */
function drawCatScene(ctx, W, H, seed) {
  const g = ctx.createLinearGradient(0, 0, W, H);
  const hues = [[255, 179, 71], [124, 92, 255], [74, 222, 128], [248, 113, 113], [56, 189, 248]];
  const c1 = pick(hues), c2 = pick(hues);
  g.addColorStop(0, `rgb(${c1[0] * .35 | 0},${c1[1] * .35 | 0},${c1[2] * .35 | 0})`);
  g.addColorStop(1, `rgb(${c2[0] * .22 | 0},${c2[1] * .22 | 0},${c2[2] * .22 | 0})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  for (let i = 0; i < 34; i++) {
    ctx.beginPath();
    ctx.arc(rand(0, W), rand(0, H), rand(6, 44), 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${rand(.015, .05)})`;
    ctx.fill();
  }
  for (let i = 0; i < 9; i++) {
    ctx.beginPath();
    ctx.arc(rand(0, W), rand(0, H), rand(20, 70), 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${randInt(80, 200)},${randInt(80, 200)},${randInt(120, 255)},.06)`;
    ctx.fill();
  }
  // büyük kedi
  ctx.font = `${Math.round(Math.min(W, H) * .55)}px serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('🐈', W / 2, H / 2 + H * .04);

  // köşe süsleri
  ctx.font = `${Math.round(Math.min(W, H) * .11)}px serif`;
  ctx.globalAlpha = .35;
  ctx.fillText('🐾', W * .13, H * .13);
  ctx.fillText('🐾', W * .87, H * .87);
  ctx.globalAlpha = 1;
}

/** Pasta dilimi SVG path'i */
function piePath(pct) {
  const R = 40, cx = 50, cy = 50;
  if (pct >= 99.9) return `M50,50 m-40,0 a40,40 0 1,0 80,0 a40,40 0 1,0 -80,0`;
  const a = (pct / 100) * Math.PI * 2 - Math.PI / 2;
  const x = cx + R * Math.cos(a), y = cy + R * Math.sin(a);
  const large = pct > 50 ? 1 : 0;
  return `M${cx},${cy} L${cx},${cy - R} A${R},${R} 0 ${large} 1 ${x.toFixed(2)} ${y.toFixed(2)} Z`;
}

/* ═══════════════════════════════════════════════════════════
   BÖLÜM 3 & 16 — Hareketli / Kaotik metin
   ═══════════════════════════════════════════════════════════ */
function movingTextLevel(root, done, chaotic) {
  const WORDS_EASY = ['MEOW', 'PAWS', 'CATS', 'FURRY', 'WHISKER', 'KITTEN'];
  const WORDS_HARD = ['CHAOS', 'TANGLED', 'SCRATCH', 'WHISKERS', 'CATNAPPED'];
  const answer = pick(chaotic ? WORDS_HARD : WORDS_EASY);

  root.appendChild(el('div', 'prompt',
    chaotic ? 'Kaotik biçimde hareket eden metni çöz ve yaz.'
            : 'Hareket eden harfleri oku ve doğru sırayla yaz.'));

  const field = el('div', 'charfield');
  root.appendChild(field);

  const chars = [];
  [...answer].forEach((ch, i) => {
    const s = el('span', 'chr', ch);
    s.dataset.i = i;
    field.appendChild(s);
    chars.push(s);
  });

  const row = el('div', 'input-row');
  const inp = el('input');
  inp.type = 'text'; inp.maxLength = 20; inp.placeholder = '• • • •';
  inp.autocomplete = 'off'; inp.spellcheck = false;
  const btn = el('button', 'btn primary', 'Onayla');
  row.appendChild(inp); row.appendChild(btn);
  root.appendChild(row);
  root.appendChild(el('p', 'hint', chaotic
    ? 'Bu sefer birden fazla bozulma aynı anda uygulanıyor. Cevap yine de okunabilir.'
    : 'Harfler durmuyor. Sabırlı ol, şekilleri tanı.'));

  let t = 0;
  let raf;
  const loop = () => {
    t += 0.045;
    chars.forEach((s, i) => {
      const ph = i * 1.35;
      if (chaotic) {
        const rot = Math.sin(t * 2.3 + ph) * 46 + Math.sin(t * 5.1 + ph * 2) * 18;
        const sk  = Math.sin(t * 3.7 + ph) * 32;
        const ty  = Math.sin(t * 4.2 + ph) * 16;
        const tx  = Math.cos(t * 3.1 + ph) * 10;
        const sc  = 1 + Math.sin(t * 6.4 + ph) * .16;
        s.style.transform = `translate(${tx}px,${ty}px) rotate(${rot}deg) skewX(${sk}deg) scale(${sc})`;
        s.style.color = `hsl(${(t * 44 + i * 46) % 360},70%,74%)`;
        s.style.opacity = .68 + Math.sin(t * 7 + ph) * .32;
      } else {
        const rot = Math.sin(t * 1.7 + ph) * 24;
        const ty  = Math.sin(t * 2.4 + ph) * 9;
        s.style.transform = `translateY(${ty}px) rotate(${rot}deg)`;
        s.style.color = `hsl(${260 + Math.sin(t + ph) * 24},58%,74%)`;
      }
    });
    raf = requestAnimationFrame(loop);
  };
  loop();

  const check = () => {
    const v = inp.value.trim().toUpperCase().replace(/\s/g, '');
    if (v === answer) {
      chars.forEach(s => { s.style.color = '#4ade80'; s.style.transform = 'none'; });
      btn.disabled = true; inp.disabled = true;
      toast('Doğru okudun! 👁', true);
      cancelAnimationFrame(raf);
      setTimeout(done, 600);
    } else {
      toast('Yanlış. Harflere tekrar dikkatli bak.');
      inp.value = ''; inp.focus();
      field.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-8px)' },
                     { transform: 'translateX(8px)' }, { transform: 'translateX(0)' }], { duration: 280 });
    }
  };
  btn.onclick = check;
  inp.onkeydown = e => { if (e.key === 'Enter') check(); };
  setTimeout(() => inp.focus(), 200);

  return () => cancelAnimationFrame(raf);
}

/* ═══════════════════════════════════════════════════════════

function selectSquaresLevel(root, done, mode) {
  // mode: 'with' | 'without' | 'real'
  const SIZE = 3;
  const total = SIZE * SIZE;

  const prompts = {
    with:    'İçinde <span class="hl">kedi</span> bulunan bütün kareleri seç.',
    without: 'İçinde <span class="hl">kedi OLMAYAN</span> bütün kareleri seç.',
    real:    'Yalnızca <span class="hl">gerçek kedileri</span> seç. Oyuncak, heykel ve dekorasyon sayılmaz.'
  };
  root.appendChild(el('div', 'prompt', prompts[mode]));

  const grid = el('div', 'grid');
  grid.style.gridTemplateColumns = `repeat(${SIZE},1fr)`;
  root.appendChild(grid);

  const tiles = [];
  const catCount = mode === 'without' ? randInt(3, 5) : randInt(4, 6);
  const catIdx = new Set();
  while (catIdx.size < catCount) catIdx.add(randInt(0, total - 1));

  for (let i = 0; i < total; i++) {
    const t = el('div', 'tile');
    let isCat;
    if (mode === 'real') {
      isCat = catIdx.has(i) && Math.random() < .55;
      if (isCat) { t.textContent = pick(CATS); t.style.background = 'linear-gradient(160deg,#3a3350,#241f33)'; }
      else {
        // kediye benzeyen nesne (heykel/oyuncak)
        t.textContent = pick(CATS);
        t.style.background = 'linear-gradient(160deg,#3a3a44,#22222a)';
        t.style.filter = Math.random() < .5 ? 'grayscale(1) contrast(.85)' : 'hue-rotate(210deg) saturate(.4)';
        t.style.opacity = .85;
      }
    } else {
      isCat = catIdx.has(i);
      if (isCat) {
        t.textContent = pick(CATS);
        t.style.background = 'linear-gradient(160deg,#3a3350,#241f33)';
      } else {
        t.textContent = pick(NONCAT);
        t.style.background = 'linear-gradient(160deg,#2b2b3a,#1c1c28)';
        t.style.fontSize = '1.7rem';
      }
    }
    t.dataset.cat = isCat ? '1' : '0';
    t.onclick = () => { if (!t.classList.contains('ok')) { t.classList.toggle('sel'); } };
    tiles.push(t);
    grid.appendChild(t);
  }

  const btn = el('button', 'btn primary', 'Doğrula');
  btn.style.marginTop = '18px';
  root.appendChild(btn);

  if (mode === 'without') {
    root.appendChild(el('p', 'hint', 'Dikkat: kelime <b style="color:var(--accent)">WITHOUT</b>. Önceki alışkanlığın seni yanıltmasın.'));
  } else if (mode === 'real') {
    root.appendChild(el('p', 'hint', 'Bir kediye benzemesi, onun kedi olduğu anlamına gelmez.'));
  } else {
    root.appendChild(el('p', 'hint', 'Kedi bazen karenin yalnızca küçük bir bölümünde görünür.'));
  }

  btn.onclick = () => {
    let ok = true;
    tiles.forEach(t => {
      const isCat = t.dataset.cat === '1';
      const sel = t.classList.contains('sel');
      let want;
      if (mode === 'with' || mode === 'real') want = isCat;
      else want = !isCat;
      if (sel === want) t.classList.add('ok'); else { t.classList.add('no'); ok = false; }
    });
    if (ok) { toast('Doğru seçim! ✅', true); btn.disabled = true; setTimeout(done, 700); }
    else {
      toast('Yanlış kareler var.');
      setTimeout(() => { tiles.forEach(t => t.classList.remove('no', 'ok')); }, 900);
    }
  };
}

/* ═══════════════════════════════════════════════════════════

   ═══════════════════════════════════════════════════════════ */
function level05(root, done) {
  root.appendChild(el('div', 'prompt', 'Parçalara tıkla ve görseli <span class="hl">doğru yöne</span> döndürerek birleştir.'));

  const S = 300, T = 100;
  const src = document.createElement('canvas');
  src.width = src.height = S;
  drawCatScene(src.getContext('2d'), S, S);

  const pieces = [];
  for (let r = 0; r < 3; r++) {
    for (let c = 0; c < 3; c++) {
      const t = document.createElement('canvas');
      t.width = t.height = T;
      t.getContext('2d').drawImage(src, c * T, r * T, T, T, 0, 0, T, T);
      pieces.push({ url: t.toDataURL(), rot: randInt(0, 3) * 90 });
    }
  }

  const grid = el('div', 'rot-grid');
  root.appendChild(grid);

  let remaining = 0;
  const els = pieces.map(p => {
    const d = el('div', 'rot-tile');
    d.style.backgroundImage = `url(${p.url})`;
    d.style.transform = `rotate(${p.rot}deg)`;
    if (p.rot % 360 !== 0) remaining++;
    d.onclick = () => {
      p.rot = (p.rot + 90) % 360;
      d.style.transform = `rotate(${p.rot}deg)`;
      if (p.rot === 0) {
        d.style.boxShadow = '0 0 0 2px #4ade80 inset';
        remaining--;
        if (remaining <= 0) { toast('Görsel birleşti! 🐈', true); setTimeout(done, 650); }
      } else {
        d.style.boxShadow = 'none';
      }
      d.animate([{ filter: 'brightness(1.6)' }, { filter: 'brightness(1)' }], { duration: 220 });
    };
    grid.appendChild(d);

  });

  if (remaining === 0) {
    // tüm parçalar zaten doğruysa yeniden karıştır
    pieces.forEach((p, i) => {
      p.rot = randInt(1, 3) * 90;
      els[i].style.transform = `rotate(${p.rot}deg)`;
    });

  root.appendChild(el('p', 'hint', 'Her tıklama parçayı 90° döndürür. Tüm parçalar doğru yöne gelince görsel tamamlanır.'));
}

/* ═══════════════════════════════════════════════════════════
   BÖLÜM 6 — Cat Tic-Tac-Toe
   ═══════════════════════════════════════════════════════════ */
function level06(root, done) {
  const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  const P = '🐱', A = '🐶';

  root.appendChild(el('div', 'prompt', 'Kedi temalı XOX\'u <span class="hl">kazan</span>. Beraberlik kabul edilmez!'));
  const board = el('div', 'ttt');
  root.appendChild(board);
  const status = el('p', 'hint', 'Sen 🐱 olarak oynuyorsun. Sıra sende.');
  root.appendChild(status);

  let cells = [], state, busy = false;

  function newGame() {
    state = Array(9).fill(null);
    busy = false;
    board.innerHTML = '';
    cells = [];
    for (let i = 0; i < 9; i++) {
      const c = el('div', 'cell');
      c.onclick = () => human(i);
      cells.push(c);
      board.appendChild(c);
    }
    status.textContent = 'Sen 🐱 olarak oynuyorsun. Sıra sende.';
  }

  function render(winLine) {
    cells.forEach((c, i) => {
      c.textContent = state[i] || '';
      c.classList.toggle('taken', !!state[i]);
      c.classList.toggle('win', !!(winLine && winLine.includes(i)));
    });
  }

  function winner(s) {
    for (const L of LINES) if (s[L[0]] && s[L[0]] === s[L[1]] && s[L[1]] === s[L[2]]) return { mark: s[L[0]], line: L };
    return s.includes(null) ? null : { mark: 'draw', line: null };
  }

  function human(i) {
    if (busy || state[i]) return;
    state[i] = P; render();
    const w = winner(state);
    if (w) return finish(w);
    busy = true;
    status.textContent = 'Rakip düşünüyor…';
    setTimeout(() => {
      const m = aiMove(state);
      state[m] = A; render();
      busy = false;
      const w2 = winner(state);
      if (w2) return finish(w2);
      status.textContent = 'Sıra sende.';
    }, 420);
  }

  function aiMove(s) {
    // 1) kazan
    for (const L of LINES) {
      const v = L.map(i => s[i]);
      if (v.filter(x => x === A).length === 2 && v.includes(null)) return L[v.indexOf(null)];
    }
    // 2) engelle
    for (const L of LINES) {
      const v = L.map(i => s[i]);
      if (v.filter(x => x === P).length === 2 && v.includes(null)) return L[v.indexOf(null)];
    }
    // 3) merkez
    if (!s[4] && Math.random() < .7) return 4;
    // 4) rastgele
    const free = s.map((v, i) => v === null ? i : -1).filter(i => i >= 0);
    return pick(free);
  }

  function finish(w) {
    render(w.line);
    if (w.mark === P) {
      status.innerHTML = '<b style="color:var(--good)">Kazandın! 🎉</b>';
      toast('Kazandın! 🐱', true);
      setTimeout(done, 800);
    } else {
      status.innerHTML = w.mark === 'draw'
        ? '<b style="color:var(--bad)">Beraberlik. Kazanman gerekiyor!</b>'
        : '<b style="color:var(--bad)">Kaybettin. Tekrar dene!</b>';
      toast(w.mark === 'draw' ? 'Beraberlik sayılmaz!' : 'Kaybettin, tekrar dene.');
      setTimeout(newGame, 1100);
    }
  }

  newGame();
}

/* ═══════════════════════════════════════════════════════════
   BÖLÜM 7 — Word Search
   ═══════════════════════════════════════════════════════════ */
function level07(root, done) {
  const N = 12;
  const WORDS = ['THECAT', 'CATSTOPSIGN'];

  root.appendChild(el('div', 'prompt', 'Harfleri sürükleyerek gizli kelimeleri bul.'));
  const grid = el('div', 'ws');
  root.appendChild(grid);
  const list = el('div', 'wordlist');
  WORDS.forEach(w => list.appendChild(el('span', '', w.toLowerCase())));
  root.appendChild(list);
  root.appendChild(el('p', 'hint', 'Başlangıç hücresine, sonra bitiş hücresine tıkla. Kelimeler yatay, dikey veya çapraz olabilir.'));

  // ızgara oluştur
  let g, placements = [];

  function build() {
    for (let attempt = 0; attempt < 200; attempt++) {
      g = Array.from({ length: N }, () => Array(N).fill(''));
      placements = [];
      let ok = true;
      for (const w of WORDS) {
        const placed = tryPlace(w);
        if (!placed) { ok = false; break; }
      }
      if (ok) break;
    }
    // doldur
    const alpha = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++)
      if (!g[r][c]) g[r][c] = alpha[randInt(0, 25)];
  }

  function tryPlace(w) {
    const dirs = [[0,1],[1,0],[1,1],[1,-1]];
    for (let t = 0; t < 300; t++) {
      const [dr, dc] = pick(dirs);
      const r0 = randInt(0, N - 1), c0 = randInt(0, N - 1);
      const r1 = r0 + dr * (w.length - 1), c1 = c0 + dc * (w.length - 1);
      if (r1 < 0 || r1 >= N || c1 < 0 || c1 >= N) continue;
      let fits = true;
      for (let i = 0; i < w.length; i++) {
        const ch = g[r0 + dr * i][c0 + dc * i];
        if (ch && ch !== w[i]) { fits = false; break; }
      }
      if (!fits) continue;
      for (let i = 0; i < w.length; i++) g[r0 + dr * i][c0 + dc * i] = w[i];
      placements.push({ w, r0, c0, dr, dc });
      return true;
    }
    return false;
  }

  build();

  const cellEls = [];
  for (let r = 0; r < N; r++) {
    cellEls.push([]);
    for (let c = 0; c < N; c++) {
      const e = el('div', 'c', g[r][c]);
      e.dataset.r = r; e.dataset.c = c;
      e.onclick = () => click(r, c);
      cellEls[r].push(e);
      grid.appendChild(e);
    }
  }

  let start = null;
  const found = new Set();

  function clearSel() {
    cellEls.flat().forEach(e => e.classList.remove('start'));
    start = null;
  }

  function click(r, c) {
    if (!start) {
      start = [r, c];
      cellEls[r][c].classList.add('start');
      return;
    }
    const [r0, c0] = start;
    const dr = Math.sign(r - r0), dc = Math.sign(c - c0);
    const len = Math.max(Math.abs(r - r0), Math.abs(c - c0)) + 1;
    const straight = (r === r0) || (c === c0) || (Math.abs(r - r0) === Math.abs(c - c0));
    if (!straight || len < 2) { clearSel(); toast('Düz bir çizgi seç.'); return; }

    let str = '';
    const cells = [];
    for (let i = 0; i < len; i++) {
      const rr = r0 + dr * i, cc = c0 + dc * i;
      str += g[rr][cc];
      cells.push([rr, cc]);
    }
    const rev = [...str].reverse().join('');
    const hit = WORDS.find(w => (w === str || w === rev) && !found.has(w));
    if (hit) {
      found.add(hit);
      cells.forEach(([rr, cc]) => cellEls[rr][cc].classList.add('found'));
      const spans = $$('.wordlist span', root);
      spans[WORDS.indexOf(hit)].classList.add('done');
      toast(`"${hit.toLowerCase()}" bulundu!`, true);
      clearSel();
      if (found.size === WORDS.length) setTimeout(done, 700);
    } else {
      toast('Bu bir kelime değil.');
      clearSel();
    }
  }
}

/* ═══════════════════════════════════════════════════════════
   BÖLÜM 9 — Tiny Cat Pieces
   ═══════════════════════════════════════════════════════════ */
function level09(root, done) {
  const S = 900, N = 3;              // 3x3 = 9 kare
  const TS = S / N;                   // 300px her kare

  root.appendChild(el('div', 'prompt', 'Kedinin <span class="hl">herhangi bir parçasının</span> bulunduğu kareleri seç.'));

  // arka plan katmanı
  const bg = document.createElement('canvas');
  bg.width = bg.height = S;
  const bc = bg.getContext('2d');
  const gr = bc.createLinearGradient(0, 0, S, S);
  gr.addColorStop(0, '#2c2743'); gr.addColorStop(1, '#171426');
  bc.fillStyle = gr; bc.fillRect(0, 0, S, S);
  for (let i = 0; i < 140; i++) {
    bc.beginPath();
    bc.arc(rand(0, S), rand(0, S), rand(20, 90), 0, Math.PI * 2);
    bc.fillStyle = `rgba(${randInt(60,160)},${randInt(60,160)},${randInt(120,220)},.045)`;
    bc.fill();
  }
  bc.font = '120px serif';
  for (let i = 0; i < 12; i++) { bc.globalAlpha = .12; bc.fillText('🐾', rand(0, S), rand(0, S)); }
  bc.globalAlpha = 1;

  // kedi katmanı (şeffaf) — kediler bilerek kenarlara taşırılıyor
  const catC = document.createElement('canvas');
  catC.width = catC.height = S;
  const cc = catC.getContext('2d');
  cc.textAlign = 'center'; cc.textBaseline = 'middle';

  const catSpots = [];
  const nCats = randInt(4, 5);
  for (let i = 0; i < nCats; i++) {
    const size = rand(230, 400);
    cc.font = `${Math.round(size)}px serif`;
    const x = rand(-60, S + 60), y = rand(-60, S + 60);
    cc.fillText(pick(CATS), x, y);
    catSpots.push({ x, y, size });
  }

  // birleştir
  const out = document.createElement('canvas');
  out.width = out.height = S;
  const oc = out.getContext('2d');
  oc.drawImage(bg, 0, 0);
  oc.drawImage(catC, 0, 0);

  // kedi piksel verisi
  const catData = cc.getImageData(0, 0, S, S).data;
  const hasCat = (r, c) => {
    const x0 = c * TS, y0 = r * TS;
    for (let y = y0; y < y0 + TS; y += 5) {
      for (let x = x0; x < x0 + TS; x += 5) {
        if (catData[(y * S + x) * 4 + 3] > 25) return true;
      }
    }
    return false;
  };

  const grid = el('div', 'grid');
  grid.style.gridTemplateColumns = `repeat(${N},1fr)`;
  grid.style.maxWidth = '440px';
  root.appendChild(grid);

  const tiles = [];
  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      const t = el('div', 'tile');
      const slice = document.createElement('canvas');
      slice.width = slice.height = TS;
      slice.getContext('2d').drawImage(out, c * TS, r * TS, TS, TS, 0, 0, TS, TS);
      t.style.backgroundImage = `url(${slice.toDataURL()})`;
      t.style.backgroundSize = 'cover';
      t.textContent = '';
      const isCat = hasCat(r, c);
      t.dataset.cat = isCat ? '1' : '0';
      t.onclick = () => { if (!t.classList.contains('ok')) t.classList.toggle('sel'); };
      tiles.push(t);
      grid.appendChild(t);
    }
  }

  const btn = el('button', 'btn primary', 'Doğrula');
  btn.style.marginTop = '18px';
  root.appendChild(btn);
  root.appendChild(el('p', 'hint', 'Kedinin yalnızca bir gözü veya bıyığı görünen kare bile seçilmelidir.'));

  btn.onclick = () => {
    let ok = true;
    tiles.forEach(t => {
      const want = t.dataset.cat === '1';
      const sel = t.classList.contains('sel');
      if (sel === want) t.classList.add('ok'); else { t.classList.add('no'); ok = false; }
    });
    if (ok) { toast('Tüm parçalar doğru! 🐾', true); btn.disabled = true; setTimeout(done, 700); }
    else {
      toast('Eksik veya fazla kare var.');
      setTimeout(() => tiles.forEach(t => t.classList.remove('no', 'ok')), 900);
    }
  };
}

/* ═══════════════════════════════════════════════════════════
   BÖLÜM 10 — Cat Whack-a-Mole
   ═══════════════════════════════════════════════════════════ */
function level10(root, done) {
  const TARGET = 5;
  let caught = 0;

  root.appendChild(el('div', 'prompt', `Yuvalardan çıkan <span class="hl">${TARGET} kediyi</span> yakala.`));

  const stat = el('div', 'stat-row', `Yakalanan: <b id="cnt">0</b> / ${TARGET}`);
  root.appendChild(stat);

  const board = el('div', 'wam');
  root.appendChild(board);
  root.appendChild(el('p', 'hint', 'Kediler giderek daha kısa süre görünür. Boşluğa tıklamak zaman kaybettirir.'));

  const holes = [];
  for (let i = 0; i < 9; i++) {
    const h = el('div', 'hole');
    h.innerHTML = '<span class="cat">🐈</span>';
    h.onclick = () => {
      if (h.classList.contains('up')) {
        h.classList.remove('up');
        caught++;
        $('#cnt').textContent = caught;
        h.style.background = 'radial-gradient(circle at 50% 35%,#1f3a2a,#0c1a12)';
        setTimeout(() => h.style.background = '', 220);
        if (caught >= TARGET) {
          clearInterval(spawnT); clearTimeout(hideT);
          toast('Hepsini yakaladın! 🎉', true);
          setTimeout(done, 650);
        }
      } else {
        h.animate([{ transform: 'scale(1)' }, { transform: 'scale(.92)' }, { transform: 'scale(1)' }], { duration: 180 });
      }
    };
    holes.push(h);
    board.appendChild(h);
  }

  let hideT = null;
  const spawnT = setInterval(() => {
    const free = holes.filter(h => !h.classList.contains('up'));
    if (!free.length) return;
    const h = pick(free);
    h.classList.add('up');
    const life = Math.max(430, 950 - caught * 90);
    hideT = setTimeout(() => h.classList.remove('up'), life);
  }, 640);

  return () => { clearInterval(spawnT); clearTimeout(hideT); };
}

/* ═══════════════════════════════════════════════════════════
   PARK OYUNU MOTORU (14,15,22,23,24)
   ═══════════════════════════════════════════════════════════ */
function parkingGame(root, done, cfg) {
  const W = 680, H = 460;
  const canvas = el('canvas', 'park');
  canvas.width = W; canvas.height = H;
  canvas.style.aspectRatio = `${W}/${H}`;

  const wrap = el('div', 'park-wrap');
  wrap.appendChild(canvas);
  root.appendChild(el('div', 'prompt', cfg.prompt));

  // D-pad
  const pad = el('div', 'dpad');
  pad.innerHTML = `
    <button class="sp"></button>
    <button data-k="up">▲</button>
    <button class="sp"></button>
    <button data-k="left">◀</button>
    <button data-k="down">▼</button>
    <button data-k="right">▶</button>`;
  wrap.appendChild(pad);

  const stat = el('div', 'stat-row', 'Deneme: <b id="tries">0</b> &nbsp;·&nbsp; Durum: <b id="st">Sürüyorsun</b>');
  wrap.appendChild(stat);
  root.appendChild(wrap);
  root.appendChild(el('p', 'hint', cfg.hint || 'Ok tuşları veya ekran butonlarıyla sür. Aynalar çizgiye değmemeli!'));

  const ctx = canvas.getContext('2d');
  const keys = { up: 0, down: 0, left: 0, right: 0 };

  const CAR = { w: 42, l: 82, mirror: 7 };
  const car = { x: cfg.start.x, y: cfg.start.y, a: cfg.start.a };

  let tries = 0;
  let resetFlash = 0;
  let raf;
  let finished = false;

  const traffic = (cfg.traffic || []).map(t => ({ ...t }));
  const walls = cfg.walls || [];

  /* --- giriş --- */
  const keyMap = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right', W: 'up', S: 'down', A: 'left', D: 'right'
  };
  function onKey(e, v) {
    const k = keyMap[e.key];
    if (k) { keys[k] = v; e.preventDefault(); }
  }
  const kd = e => onKey(e, 1), ku = e => onKey(e, 0);
  window.addEventListener('keydown', kd);
  window.addEventListener('keyup', ku);

  const padBtns = $$('button[data-k]', pad);
  padBtns.forEach(b => {
    const k = b.dataset.k;
    const on = e => { e.preventDefault(); keys[k] = 1; b.classList.add('on'); };
    const off = e => { e.preventDefault(); keys[k] = 0; b.classList.remove('on'); };
    b.addEventListener('pointerdown', on);
    b.addEventListener('pointerup', off);
    b.addEventListener('pointerleave', off);
    b.addEventListener('pointercancel', off);
  });

  /* --- geometri --- */
  function carPoints(c) {
    const loc = [
      [-CAR.w / 2, -CAR.l / 2],
      [ CAR.w / 2, -CAR.l / 2],
      [-CAR.w / 2,  CAR.l / 2],
      [ CAR.w / 2,  CAR.l / 2],
      [-CAR.w / 2 - CAR.mirror, -CAR.l / 2 + 14],
      [ CAR.w / 2 + CAR.mirror, -CAR.l / 2 + 14]
    ];
    const cs = Math.cos(c.a), sn = Math.sin(c.a);
    return loc.map(([x, y]) => [c.x + x * cs - y * sn, c.y + x * sn + y * cs]);
  }

  function inRect(p, r, pad = 0) {
    return p[0] >= r.x + pad && p[0] <= r.x + r.w - pad &&
           p[1] >= r.y + pad && p[1] <= r.y + r.h - pad;
  }

  function carAABB(c) {
    const pts = carPoints(c);
    const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
    return { x: Math.min(...xs), y: Math.min(...ys), w: Math.max(...xs) - Math.min(...xs), h: Math.max(...ys) - Math.min(...ys) };
  }

  function hitRect(c, r) {
    const b = carAABB(c);
    return b.x < r.x + r.w && b.x + b.w > r.x && b.y < r.y + r.h && b.y + b.h > r.y;
  }

  function reset(msg) {
    tries++;
    $('#tries').textContent = tries;
    toast(msg || 'Çarptın! Baştan başlıyorsun.');
    car.x = cfg.start.x; car.y = cfg.start.y; car.a = cfg.start.a;
    resetFlash = 14;
  }

  /* --- döngü --- */
  function loop() {
    if (finished) return;

    const SPEED = 1.9, TURN = 0.042;

    // dönüş
    if (keys.left)  car.a -= TURN;
    if (keys.right) car.a += TURN;

    // hareket
    const mv = (keys.up ? 1 : 0) - (keys.down ? 1 : 0);
    if (mv) {
      car.x += Math.sin(car.a) * SPEED * mv;
      car.y += -Math.cos(car.a) * SPEED * mv;
    }

    // sınırlar
    car.x = Math.max(28, Math.min(W - 28, car.x));
    car.y = Math.max(28, Math.min(H - 28, car.y));

    // duvarlar
    for (const w of walls) {
      if (hitRect(car, w)) { reset(); break; }
    }

    // trafik
    for (const t of traffic) {
      t.x += t.vx || 0;
      t.y += t.vy || 0;
      if (t.x > W + 120) t.x = -140;
      if (t.x < -140) t.x = W + 120;
      if (t.y > H + 120) t.y = -140;
      if (t.y < -140) t.y = H + 120;
      if (hitRect(car, t)) reset('Araba sana çarptı!');
    }

    draw();

    // kazanma kontrolü
    const target = cfg.target;
    const pts = carPoints(car);
    const allIn = pts.every(p => inRect(p, target, 3));
    let angOK;
    if (target.a === undefined) angOK = true;
    else {
      let d = car.a - target.a;
      while (d > Math.PI) d -= Math.PI * 2;
      while (d < -Math.PI) d += Math.PI * 2;
      angOK = Math.abs(d) < 0.16;
    }

    if (allIn && angOK) {
      finished = true;
      $('#st').textContent = 'Park edildi ✓';
      toast('Mükemmel park! 🅿️', true);
      setTimeout(done, 750);
      return;
    }

    raf = requestAnimationFrame(loop);
  }

  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function draw() {
    // zemin
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#1a1628'); g.addColorStop(1, '#100e18');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    // asfalt dokusu
    ctx.fillStyle = 'rgba(255,255,255,.022)';
    for (let i = 0; i < 90; i++) {
      ctx.fillRect((i * 137) % W, (i * 83) % H, 2, 2);
    }

    // park hedefi
    const t = cfg.target;
    ctx.save();
    ctx.translate(t.x + t.w / 2, t.y + t.h / 2);
    ctx.rotate(t.a || 0);
    ctx.fillStyle = 'rgba(74,222,128,.09)';
    roundRect(ctx, -t.w / 2, -t.h / 2, t.w, t.h, 8);
    ctx.fill();
    ctx.setLineDash([9, 7]);
    ctx.strokeStyle = 'rgba(74,222,128,.85)';
    ctx.lineWidth = 2.5;
    roundRect(ctx, -t.w / 2, -t.h / 2, t.w, t.h, 8);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(74,222,128,.55)';
    ctx.font = 'bold 13px system-ui';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('P', 0, 0);
    ctx.restore();

    // duvarlar
    for (const w of walls) {
      ctx.fillStyle = '#2b2540';
      roundRect(ctx, w.x, w.y, w.w, w.h, 6);
      ctx.fill();
      ctx.strokeStyle = '#413764';
      ctx.lineWidth = 2;
      roundRect(ctx, w.x, w.y, w.w, w.h, 6);
      ctx.stroke();
    }

    // park edilmiş araçlar (statik trafik)
    for (const tr of traffic) {
      ctx.fillStyle = tr.color || '#4a4363';
      roundRect(ctx, tr.x, tr.y, tr.w, tr.h, 7);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.12)';
      roundRect(ctx, tr.x + 7, tr.y + 9, tr.w - 14, tr.h * .3, 4);
      ctx.fill();
    }

    // oyuncu arabası
    ctx.save();
    ctx.translate(car.x, car.y);
    ctx.rotate(car.a);

    // gölge
    ctx.fillStyle = 'rgba(0,0,0,.45)';
    roundRect(ctx, -CAR.w / 2 + 3, -CAR.l / 2 + 4, CAR.w, CAR.l, 8);
    ctx.fill();

    // gövde
    const cg = ctx.createLinearGradient(-CAR.w / 2, 0, CAR.w / 2, 0);
    cg.addColorStop(0, '#ff9f43'); cg.addColorStop(1, '#ffcf70');
    ctx.fillStyle = cg;
    roundRect(ctx, -CAR.w / 2, -CAR.l / 2, CAR.w, CAR.l, 8);
    ctx.fill();

    // ön cam
    ctx.fillStyle = 'rgba(20,25,50,.75)';
    roundRect(ctx, -CAR.w / 2 + 6, -CAR.l / 2 + 11, CAR.w - 12, 20, 4);
    ctx.fill();
    // arka cam
    roundRect(ctx, -CAR.w / 2 + 6, CAR.l / 2 - 30, CAR.w - 12, 18, 4);
    ctx.fill();

    // farlar
    ctx.fillStyle = '#fff6d6';
    ctx.fillRect(-CAR.w / 2 + 5, -CAR.l / 2 + 2, 8, 5);
    ctx.fillRect(CAR.w / 2 - 13, -CAR.l / 2 + 2, 8, 5);

    // aynalar
    ctx.fillStyle = '#ff7b3d';
    ctx.fillRect(-CAR.w / 2 - CAR.mirror, -CAR.l / 2 + 11, CAR.mirror, 7);
    ctx.fillRect(CAR.w / 2, -CAR.l / 2 + 11, CAR.mirror, 7);

    // kedi süsü
    ctx.font = '15px serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('🐈', 0, 12);

    ctx.restore();

    // çarpma flaşı
    if (resetFlash > 0) {
      ctx.fillStyle = `rgba(248,113,113,${resetFlash / 40})`;
      ctx.fillRect(0, 0, W, H);
      resetFlash--;
    }
  }

  draw();
  raf = requestAnimationFrame(loop);

  return () => {
    finished = true;
    cancelAnimationFrame(raf);
    window.removeEventListener('keydown', kd);
    window.removeEventListener('keyup', ku);
  };
}

/* ═══════════════════════════════════════════════════════════

function level18(root, done) {
  const GOAL = 10;
  let found = 0;

  root.appendChild(el('div', 'prompt', 'İçinde <span class="hl">kedi</span> bulunan kareleri seç. Izgara bitmeyecek gibi görünüyor…'));

  const stat = el('div', 'stat-row', 'Bulunan: <b id="e18cnt">0</b> / ' + GOAL);
  root.appendChild(stat);

  const grid = el('div', 'grid');
  grid.style.maxWidth = '460px';
  grid.style.gridTemplateColumns = 'repeat(6,1fr)';
  root.appendChild(grid);
  root.appendChild(el('p', 'hint', 'Her doğru seçimde ızgara büyür. 10 kediyi bulunca doğrulama tamamlanır.'));

  function addTile() {
    const t = el('div', 'tile');
    t.style.fontSize = '1.35rem';
    const isCat = Math.random() < .3;
    t.textContent = isCat ? pick(CATS) : pick([...NONCAT, ...OBJECTS, '🌿', '🪨', '🍄', '🌰']);
    t.dataset.cat = isCat ? '1' : '0';
    t.onclick = () => {
      if (t.classList.contains('ok') || t.classList.contains('no')) return;
      if (t.dataset.cat === '1') {
        t.classList.add('ok');
        found++;
        $('#e18cnt').textContent = found;
        if (found >= GOAL) {
          toast('10 kedi bulundu! 🎉', true);
          grid.style.pointerEvents = 'none';
          setTimeout(done, 700);
        } else if (found % 2 === 0) {
          // ızgarayı büyüt
          for (let i = 0; i < 6; i++) addTile();
        }
      } else {
        t.classList.add('no');
        setTimeout(() => t.classList.remove('no'), 500);
        toast('Bu kedi değil.');
      }
    };
    grid.appendChild(t);
  }

  for (let i = 0; i < 36; i++) addTile();
}

/* ═══════════════════════════════════════════════════════════
   BÖLÜM 19 — Catch the Escaping Cats
   ═══════════════════════════════════════════════════════════ */
function level19(root, done) {
  const TARGET = 5;
  let caught = 0;
  let timeLeft = 32;

  root.appendChild(el('div', 'prompt', `Kaçan <span class="hl">${TARGET} kediyi</span> süre dolmadan yakala.`));

  const stat = el('div', 'stat-row', 'Yakalanan: <b id="c19">0</b> / ' + TARGET + ' &nbsp;·&nbsp; Süre: <b id="t19">32</b>s');
  root.appendChild(stat);

  const arena = el('div', 'arena');
  root.appendChild(arena);
  root.appendChild(el('p', 'hint', 'Kediler serbestçe hareket eder ve yön değiştirir. Hareket yönünü tahmin et.'));

  const cats = [];
  let raf, timer;

  function spawn() {
    const size = 34;
    const r = arena.getBoundingClientRect();
    const W = r.width || 540, H = r.height || 340;
    const c = {
      x: rand(10, Math.max(20, W - size - 10)),
      y: rand(10, Math.max(20, H - size - 10)),
      vx: rand(-2.6, 2.6), vy: rand(-2.6, 2.6),
      el: el('div', 'ecat', pick(CATS)),
      size
    };
    if (Math.abs(c.vx) < .9) c.vx = c.vx > 0 ? 1.4 : -1.4;
    if (Math.abs(c.vy) < .9) c.vy = c.vy > 0 ? 1.4 : -1.4;

    c.el.style.left = c.x + 'px';
    c.el.style.top = c.y + 'px';
    c.el.onclick = () => catchCat(c);
    arena.appendChild(c.el);
    cats.push(c);
  }

  function catchCat(c) {
    if (c.dead) return;
    c.dead = true;
    c.el.classList.add('caught');
    setTimeout(() => c.el.remove(), 300);
    caught++;
    $('#c19').textContent = caught;
    if (caught >= TARGET) finish(true);
  }

  function finish(win) {
    cancelAnimationFrame(raf);
    clearInterval(timer);
    if (win) { toast('Hepsini yakaladın! 🐾', true); arena.style.pointerEvents = 'none'; setTimeout(done, 700); }
    else toast('Süre doldu! Tekrar dene.');
  }

  function loop() {
    const r = arena.getBoundingClientRect();
    const W = r.width, H = r.height;
    cats.forEach(c => {
      if (c.dead) return;
      c.x += c.vx; c.y += c.vy;
      if (c.x < 0) { c.x = 0; c.vx *= -1; }
      if (c.x > W - c.size) { c.x = W - c.size; c.vx *= -1; }
      if (c.y < 0) { c.y = 0; c.vy *= -1; }
      if (c.y > H - c.size) { c.y = H - c.size; c.vy *= -1; }
      // rastgele yön değiştir
      if (Math.random() < .012) {
        c.vx += rand(-1.2, 1.2); c.vy += rand(-1.2, 1.2);
        const sp = Math.hypot(c.vx, c.vy);
        const max = 3.6;
        if (sp > max) { c.vx = c.vx / sp * max; c.vy = c.vy / sp * max; }
      }
      c.el.style.left = c.x + 'px';
      c.el.style.top = c.y + 'px';
      c.el.style.transform = c.vx > 0 ? 'scaleX(-1)' : 'scaleX(1)';
    });
    raf = requestAnimationFrame(loop);
  }

  for (let i = 0; i < 6; i++) spawn();
  raf = requestAnimationFrame(loop);

  timer = setInterval(() => {
    timeLeft--;
    $('#t19').textContent = Math.max(0, timeLeft);
    if (timeLeft <= 0) finish(false);
  }, 1000);

  return () => { cancelAnimationFrame(raf); clearInterval(timer); };
}

/* ═══════════════════════════════════════════════════════════
   BÖLÜM 20 — Eye Test
   ═══════════════════════════════════════════════════════════ */
function level20(root, done) {
  const ROUNDS = [
    { n: 5, ch: 'E',  flip: true  },
    { n: 6, ch: 'R',  flip: true  },
    { n: 7, ch: 'N',  flip: true  }
  ];
  let round = 0;

  const prompt = el('div', 'prompt', '');
  root.appendChild(prompt);
  const grid = el('div', 'eyegrid');
  root.appendChild(grid);
  const hint = el('p', 'hint', 'Ters çevrilmiş karakteri bul. Bu bir göz sağlığı testi değil, dikkat oyunu.');
  root.appendChild(hint);

  function build() {
    const cfg = ROUNDS[round];
    const total = cfg.n * cfg.n;
    const odd = randInt(0, total - 1);
    prompt.innerHTML = `Farklı olan karakteri bul. <span class="hl">Tur ${round + 1}/3</span>`;
    grid.innerHTML = '';
    grid.style.gridTemplateColumns = `repeat(${cfg.n},1fr)`;
    grid.style.maxWidth = Math.min(400, cfg.n * 46 + 24) + 'px';

    for (let i = 0; i < total; i++) {
      const e = el('div', 'e', cfg.ch);
      e.style.fontSize = Math.max(14, 30 - cfg.n * 2) + 'px';
      if (i === odd) {
        e.style.transform = 'scaleX(-1)';
        e.style.color = '#ffb347';
      }
      e.onclick = () => {
        if (i === odd) {
          round++;
          if (round >= ROUNDS.length) {
            toast('Gözler yerinde! 👁', true);
            grid.style.pointerEvents = 'none';
            setTimeout(done, 700);
          } else {
            toast('Doğru! Sonraki tur…', true);
            setTimeout(build, 450);
          }
        } else {
          e.animate([{ transform: 'scale(1)' }, { transform: 'scale(.85)' }, { transform: 'scale(1)' }], { duration: 220 });
          toast('Bu değil, tekrar bak.');
        }
      };
      grid.appendChild(e);
    }
  }
  build();
}

/* ═══════════════════════════════════════════════════════════
   BÖLÜM 21 — Draw Yourself
   ═══════════════════════════════════════════════════════════ */
function level21(root, done) {
  root.appendChild(el('div', 'prompt', 'Boş alana <span class="hl">bir kedi</span> çiz. Gerçekten çiz — bir çizgi yeterli değil.'));

  const wrap = el('div', 'draw-wrap');
  const canvas = el('canvas', 'draw');
  const SIZE = 520;
  canvas.width = canvas.height = SIZE;
  wrap.appendChild(canvas);
  root.appendChild(wrap);

  const row = el('div', 'input-row');
  row.style.maxWidth = '440px';
  const btnClear = el('button', 'btn', 'Temizle');
  const btnCheck = el('button', 'btn primary', 'Çizimi Doğrula');
  row.appendChild(btnClear); row.appendChild(btnCheck);
  root.appendChild(row);
  root.appendChild(el('p', 'hint', 'İpucu: yuvarlak bir kafa + iki kulak + bıyıklar. Fare veya parmakla çizebilirsin.'));

  const ctx = canvas.getContext('2d');
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#2a2340';
  ctx.lineWidth = 6;

  let drawing = false, strokes = 0, last = null;

  function pos(e) {
    const r = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return {
      x: (t.clientX - r.left) / r.width * SIZE,
      y: (t.clientY - r.top) / r.height * SIZE
    };
  }
  function start(e) { e.preventDefault(); drawing = true; strokes++; last = pos(e); }
  function move(e) {
    if (!drawing) return;
    e.preventDefault();
    const p = pos(e);
    ctx.beginPath();
    ctx.moveTo(last.x, last.y);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    last = p;
  }
  function end() { drawing = false; last = null; }

  canvas.addEventListener('pointerdown', start);
  canvas.addEventListener('pointermove', move);
  window.addEventListener('pointerup', end);

  btnClear.onclick = () => {
    ctx.clearRect(0, 0, SIZE, SIZE);
    strokes = 0;
  };

  btnCheck.onclick = () => {
    const d = ctx.getImageData(0, 0, SIZE, SIZE).data;
    let count = 0, minX = SIZE, maxX = 0, minY = SIZE, maxY = 0;
    for (let y = 0; y < SIZE; y += 2) {
      for (let x = 0; x < SIZE; x += 2) {
        if (d[(y * SIZE + x) * 4 + 3] > 30) {
          count++;
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        }
      }
    }
    const bw = maxX - minX, bh = maxY - minY;

    if (strokes < 3) { toast('Daha fazla çizgi çiz. Bir kedi bu değil.'); return; }
    if (count < 320) { toast('Çizim çok küçük. Daha büyük çiz.'); return; }
    if (bw < 100 || bh < 100) { toast('Çizim çok dar. Alanı daha iyi kullan.'); return; }

    toast('Kedi kabul edildi! 🐈', true);
    btnCheck.disabled = true; btnClear.disabled = true;
    canvas.style.pointerEvents = 'none';
    setTimeout(done, 700);
  };

  return () => window.removeEventListener('pointerup', end);
}
